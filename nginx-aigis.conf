server {
    listen 80 default_server;
    server_name _;

    # Logo, photos and videos served straight from disk (supports video seeking)
    location /__l5e/ {
        root /var/www/aigis-site/public;
        types { video/webm webm; video/mp4 mp4; image/png png; image/jpeg jpg; }
        expires 30d;
    }
    location /assets/ {
        root /var/www/aigis-site/public;
        expires 30d;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
